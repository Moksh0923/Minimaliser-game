<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1311">
    <title>Game Table</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">
</head>
<body>
<main class="app">
    <header class="home-head">
        <h1>Game table</h1>
        <p class="lede">Pick a game. Play on one screen or across two devices.</p>
    </header>

    <nav class="games" aria-label="Games">
        <a class="game-card" href="minimaliser.html">
            <span class="game-art" aria-hidden="true">
                <span>12</span><span>7</span><span class="lead">3</span>
            </span>
            <span class="game-body">
                <span class="game-title">Minimaliser</span>
                <span class="game-text">Score-keeper for card games. Add up rounds, lowest total wins.</span>
                <span class="game-meta">2&ndash;12 players &middot; one device</span>
            </span>
        </a>

        <a class="game-card" href="tictactoe.html">
            <span class="game-art ttt" aria-hidden="true">
                <span>X</span><span>O</span><span>X</span>
                <span></span><span>X</span><span>O</span>
                <span>O</span><span></span><span class="lead">X</span>
            </span>
            <span class="game-body">
                <span class="game-title">Tic tac toe</span>
                <span class="game-text">Host a party, share the code, and play live on two devices.</span>
                <span class="game-meta">2 players &middot; online</span>
            </span>
        </a>
    </nav>
</main>
</body>
</html>
